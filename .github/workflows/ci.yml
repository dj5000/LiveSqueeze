name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ffmpeg clang
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CC=clang CXX=clang++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLSQ_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Cross-check loudness range and true peak with ffmpeg
        if: matrix.compiler == 'gcc'
        run: scripts/xcheck_ffmpeg.sh build/cli/lsq-cli
      - name: Live engine self-test (software-timed null devices, real threads)
        run: build/apps/run/lsq-run --backend null --selftest
      - name: Upload tools
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: lsq-tools-linux
          path: |
            build/cli/lsq-cli
            build/apps/run/lsq-run
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            sanitize: "address;undefined"
          - name: TSan
            sanitize: "thread"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLSQ_WERROR=ON "-DLSQ_SANITIZE=${{ matrix.sanitize }}"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Live engine self-test (software-timed null devices, real threads)
        run: build\apps\run\Release\lsq-run.exe --backend null --selftest
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: lsq-tools-windows
          path: |
            build/cli/Release/lsq-cli.exe
            build/apps/run/Release/lsq-run.exe
          if-no-files-found: error

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Live engine self-test (software-timed null devices, real threads)
        run: build/apps/run/lsq-run --backend null --selftest
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: lsq-tools-macos
          path: |
            build/cli/lsq-cli
            build/apps/run/lsq-run
          if-no-files-found: error

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' '*.h' ':!:third_party/**' \
            | xargs -r clang-format-18 --dry-run --Werror
